<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff" id="themeColor">
<title>Tiempo</title>
<style>
  :root {
    --bg1:#7ec8ff; --bg2:#ffe3b0;
    --b1:#ffd36b; --b2:#ff9aa8; --b3:#5ad1c9;
    --fg:#12283f; --mute:rgba(18,40,63,.58);
    --glass-a:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.20);
    --glass-border:rgba(255,255,255,.75); --hair:rgba(18,40,63,.10);
    --rain:#2f7df6; --ok:#1fc98a; --shadow:rgba(40,70,130,.18);
  }
  body[data-theme="cloudy"] { --bg1:#a9c7e8; --bg2:#f6d9e4; --b1:#ffffff; --b2:#ffb3c1; --b3:#8fd3f4; }
  body[data-theme="rain"]   { --bg1:#5f9bd1; --bg2:#9fe0d4; --b1:#4fa3ff; --b2:#62e0c1; --b3:#a8e6ff; }
  body[data-theme="night"]  {
    --bg1:#0e2748; --bg2:#1f6280; --b1:#2c7da0; --b2:#ff8fa3; --b3:#3ac7b8;
    --fg:#f2f8ff; --mute:rgba(242,248,255,.62);
    --glass-a:rgba(255,255,255,.17); --glass-b:rgba(255,255,255,.05);
    --glass-border:rgba(255,255,255,.30); --hair:rgba(255,255,255,.14);
    --rain:#7fb4ff; --shadow:rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg1); }
  body {
    min-height:100vh; color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
    transition:background .6s;
    overflow-x:hidden;
  }
  /* Blobs de couleur derrière le verre */
  .blob { position:fixed; border-radius:50%; filter:blur(55px); opacity:.85; z-index:0; pointer-events:none; transition:background .6s; }
  .blob.a { width:300px; height:300px; background:var(--b1); top:-80px; right:-90px; animation:float1 14s ease-in-out infinite; }
  .blob.b { width:260px; height:260px; background:var(--b2); top:42%; left:-110px; animation:float2 17s ease-in-out infinite; }
  .blob.c { width:280px; height:280px; background:var(--b3); bottom:-110px; right:-60px; animation:float3 19s ease-in-out infinite; }
  @keyframes float1 { 50% { transform:translate(-40px,50px) scale(1.1);} }
  @keyframes float2 { 50% { transform:translate(50px,-40px) scale(1.15);} }
  @keyframes float3 { 50% { transform:translate(-50px,-30px) scale(.95);} }

  .wrap { position:relative; z-index:1; max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  /* Verre liquide */
  .glass {
    position:relative; border-radius:30px; padding:20px;
    background:linear-gradient(135deg,var(--glass-a),var(--glass-b));
    -webkit-backdrop-filter:blur(26px) saturate(1.7); backdrop-filter:blur(26px) saturate(1.7);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 36px var(--shadow), inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.18);
    overflow:hidden;
  }
  .glass::before {
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:radial-gradient(120% 60% at 15% -10%, rgba(255,255,255,.55), transparent 55%);
    opacity:.7;
  }
  .glass > * { position:relative; }

  .pill {
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
    padding:7px 12px; border-radius:999px;
    background:rgba(255,255,255,.38); border:1px solid rgba(255,255,255,.6);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    white-space:nowrap;
  }
  body[data-theme="night"] .pill { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(31,201,138,.6); animation:pulse 2.2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(31,201,138,0);} 100% { box-shadow:0 0 0 0 rgba(31,201,138,0);} }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spread { justify-content:space-between; }

  .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:700; display:flex; align-items:center; gap:6px; }
  .label .ic { font-size:15px; letter-spacing:0; }

  /* Carte principale */
  .hello { font-size:15px; font-weight:700; margin-top:18px; color:var(--mute); }
  .hero { display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .temp { font-size:104px; font-weight:800; letter-spacing:-.05em; line-height:1; }
  .temp sup { font-size:38px; font-weight:700; vertical-align:top; position:relative; top:12px; letter-spacing:0; color:var(--mute); }
  .bigicon { font-size:84px; line-height:1; filter:drop-shadow(0 8px 14px rgba(0,0,0,.18)); animation:bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-2deg);} }
  .cond { font-size:22px; font-weight:700; margin-top:2px; }
  .pills { margin-top:14px; }

  .range { margin-top:20px; }
  .range-top { display:flex; justify-content:space-between; font-size:15px; font-weight:700; margin-bottom:8px; }
  .range-top span small { color:var(--mute); font-weight:600; font-size:12px; margin-right:4px; }
  .track { height:10px; border-radius:999px; background:var(--hair); position:relative; }
  .track .fill { position:absolute; inset:0; border-radius:inherit; background:linear-gradient(90deg,#3b9cff,#34d3b0,#ffd23f,#ff8a3d); opacity:.95; }
  .track .mark { position:absolute; top:50%; width:20px; height:20px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 2px 8px rgba(0,0,0,.28); border:3px solid var(--fg); }

  /* Verdict */
  .verdict { display:flex; align-items:center; gap:14px; padding:18px 20px; }
  .verdict .vi { font-size:40px; line-height:1; }
  .verdict .vt { font-size:19px; font-weight:800; line-height:1.25; }
  .verdict .vs { font-size:13px; color:var(--mute); font-weight:600; margin-top:3px; }
  .verdict.rain { background:linear-gradient(135deg,rgba(47,125,246,.38),rgba(255,255,255,.18)); }
  .verdict.dry  { background:linear-gradient(135deg,rgba(31,201,138,.36),rgba(255,255,255,.18)); }

  /* Stats */
  .stats { display:grid; grid-template-columns:1fr 1fr; }
  .stat { padding:14px 0; }
  .stat:nth-child(odd) { padding-right:14px; }
  .stat:nth-child(even) { padding-left:16px; border-left:1px solid var(--hair); }
  .stat:nth-child(n+3) { border-top:1px solid var(--hair); }
  .val { font-size:30px; font-weight:800; letter-spacing:-.03em; margin-top:6px; }
  .val small { font-size:15px; font-weight:700; color:var(--mute); letter-spacing:0; margin-left:2px; }
  .sub { font-size:12px; color:var(--mute); font-weight:600; margin-top:4px; }
  .mini { height:7px; border-radius:999px; background:var(--hair); margin-top:9px; overflow:hidden; }
  .mini i { display:block; height:100%; border-radius:inherit; }

  /* Heures */
  .hours { display:flex; gap:10px; overflow-x:auto; margin:12px -20px -6px; padding:2px 20px 10px; scroll-snap-type:x proximity; scrollbar-width:none; }
  .hours::-webkit-scrollbar { display:none; }
  .tile {
    flex:0 0 auto; width:66px; text-align:center; padding:12px 0 10px; border-radius:22px; scroll-snap-align:start;
    background:rgba(255,255,255,.30); border:1px solid rgba(255,255,255,.55);
  }
  body[data-theme="night"] .tile { background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.22); }
  .tile.cur { background:rgba(255,255,255,.65); border-color:#fff; box-shadow:0 6px 18px var(--shadow); }
  body[data-theme="night"] .tile.cur { background:rgba(255,255,255,.28); }
  .tile .th { font-size:12px; font-weight:700; color:var(--mute); }
  .tile .te { font-size:30px; margin:6px 0 4px; line-height:1; }
  .tile .tt { font-size:18px; font-weight:800; }
  .tile .tp { font-size:12px; font-weight:700; color:var(--mute); margin-top:4px; }
  .tile .tp.wet { color:var(--rain); }

  footer { text-align:center; font-size:12px; font-weight:600; color:var(--mute); padding:2px 0 4px; }
  .err { font-weight:600; color:var(--mute); padding:12px 0; }
</style>
</head>
<body data-theme="sunny">
<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>

<div class="wrap" id="app">
  <section class="glass"><p class="err">Cargando el tiempo… ☁️</p></section>
</div>

<script>
// ====== CONFIG ======
const LAT = 40.4400, LON = -3.6700;   // La Guindalera, Madrid
const RAIN_THRESHOLD = 40;            // % à partir duquel on parle de pluie
const HOURS_SHOWN = 12;               // nombre d'heures dans la bande horaire
// ====================

const API = "https://api.open-meteo.com/v1/forecast"
  + "?latitude=" + LAT + "&longitude=" + LON
  + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation"
  + "&hourly=temperature_2m,precipitation_probability,precipitation,weather_code"
  + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max"
  + "&timezone=Europe%2FMadrid&forecast_days=2&wind_speed_unit=kmh";

const WMO = {
  0:"Cielo despejado",1:"Mayormente despejado",2:"Parcialmente nublado",3:"Cubierto",
  45:"Niebla",48:"Niebla engelante",
  51:"Llovizna ligera",53:"Llovizna",55:"Llovizna intensa",56:"Llovizna helada",57:"Llovizna helada",
  61:"Lluvia débil",63:"Lluvia",65:"Lluvia fuerte",66:"Lluvia helada",67:"Lluvia helada",
  71:"Nieve débil",73:"Nieve",75:"Nieve fuerte",77:"Granizo fino",
  80:"Chubascos débiles",81:"Chubascos",82:"Chubascos violentos",85:"Chubascos de nieve",86:"Chubascos de nieve",
  95:"Tormenta",96:"Tormenta con granizo",99:"Tormenta con granizo"
};

function emoji(code, night){
  if(code === 0) return night ? "🌙" : "☀️";
  if(code === 1) return night ? "🌙" : "🌤️";
  if(code === 2) return night ? "☁️" : "⛅";
  if(code === 3) return "☁️";
  if(code === 45 || code === 48) return "🌫️";
  if(code >= 51 && code <= 57) return "🌦️";
  if(code >= 61 && code <= 67) return "🌧️";
  if(code >= 71 && code <= 77) return "❄️";
  if(code === 80 || code === 81) return "🌦️";
  if(code === 82) return "🌧️";
  if(code === 85 || code === 86) return "🌨️";
  if(code >= 95) return "⛈️";
  return "🌡️";
}

const $app = document.getElementById("app");
const r = n => Math.round(n);
const hhmm = s => s.slice(11,16);
const hourOf = s => Number(s.slice(11,13)) + Number(s.slice(14,16))/60;
const fr1 = n => (Math.round(n*10)/10).toLocaleString("es-ES");

function save(d){ try{ localStorage.setItem("meteo2", JSON.stringify({d, t:Date.now()})); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem("meteo2")); }catch(e){ return null; } }

function madridHour(){
  const parts = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",hourCycle:"h23",timeZone:"Europe/Madrid"}).formatToParts(new Date());
  const hp = parts.find(p => p.type === "hour");
  return (parseInt(hp ? hp.value : "0", 10) || 0) % 24;
}

function uvLabel(u){ return u < 3 ? "Bajo" : u < 6 ? "Moderado" : u < 8 ? "Alto" : u < 11 ? "Muy alto" : "Extremo"; }
function uvColor(u){ return u < 3 ? "#1fc98a" : u < 6 ? "#ffc933" : u < 8 ? "#ff8a3d" : "#ff4d4d"; }

function verdict(d, nowH){
  const h = d.hourly, c = d.current;
  if(c.precipitation > 0.1) return {rain:true, icon:"🌧️", t:"Está lloviendo ahora mismo", s:"¡Saca el paraguas!"};
  const wet = [];
  for(let i = nowH; i < nowH + 24 && i < h.time.length; i++){
    if(h.precipitation_probability[i] >= RAIN_THRESHOLD || h.precipitation[i] >= 0.3) wet.push(i);
  }
  const hr = i => (i % 24) + " h";
  if(!wet.length){
    const mx = d.daily.precipitation_probability_max[0];
    return {rain:false, icon:"😎", t:"No se espera lluvia", s: mx >= 20 ? "Pequeño riesgo de chubasco (" + mx + " %)" : "Día tranquilo"};
  }
  const a = wet[0], b = wet[wet.length-1];
  const when = a === b ? "hacia las " + hr(a) : "entre las " + hr(a) + " y las " + hr(b+1);
  return {rain:true, icon:"☔", t:"Coge un paraguas", s:"Lluvia probable " + when};
}

function render(d, stamp){
  const nowH = madridHour();
  const c = d.current, day = d.daily, h = d.hourly;
  const sunrise = hourOf(day.sunrise[0]), sunset = hourOf(day.sunset[0]);
  const isNight = nowH + .5 < sunrise || nowH + .5 >= sunset;
  const isNightAt = i => { const hh = (i % 24) + .5; return hh < sunrise || hh >= sunset; };

  // Thème visuel
  const rainy = (c.weather_code >= 51 && c.weather_code <= 99) || c.precipitation > 0.1;
  let theme = "sunny";
  if(isNight) theme = "night";
  else if(rainy) theme = "rain";
  else if([3,45,48].includes(c.weather_code)) theme = "cloudy";
  document.body.dataset.theme = theme;
  const tc = {sunny:"#7ec8ff", cloudy:"#a9c7e8", rain:"#5f9bd1", night:"#0e2748"}[theme];
  document.getElementById("themeColor").setAttribute("content", tc);

  const v = verdict(d, nowH);
  const tmin = day.temperature_2m_min[0], tmax = day.temperature_2m_max[0];
  let pos = tmax > tmin ? (c.temperature_2m - tmin) / (tmax - tmin) : .5;
  pos = Math.max(0, Math.min(1, pos)) * 100;

  const greet = nowH < 6 ? "Buenas noches 🌙" : nowH < 12 ? "Buenos días ☀️" : nowH < 20 ? "Buenas tardes 🌸" : "Buenas noches 🌙";
  const dateStr = new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Madrid"}).format(new Date());
  const upd = new Date(stamp).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});

  // Bande horaire
  let tiles = "";
  for(let k = 0; k < HOURS_SHOWN; k++){
    const i = nowH + k;
    if(i >= h.time.length) break;
    const p = h.precipitation_probability[i] ?? 0;
    tiles += '<div class="tile' + (k === 0 ? " cur" : "") + '">'
      + '<div class="th">' + (k === 0 ? "Ahora" : (i % 24) + " h") + '</div>'
      + '<div class="te">' + emoji(h.weather_code[i], isNightAt(i)) + '</div>'
      + '<div class="tt">' + r(h.temperature_2m[i]) + '°</div>'
      + '<div class="tp' + (p >= RAIN_THRESHOLD ? " wet" : "") + '">💧 ' + p + '%</div>'
      + '</div>';
  }

  const rainMax = day.precipitation_probability_max[0];
  const uv = day.uv_index_max[0];

  $app.innerHTML =
    // --- Carte principale
    '<section class="glass">'
      + '<div class="row spread">'
        + '<span class="pill"><span class="dot"></span>Madrid · La Guindalera</span>'
        + '<span class="pill">🕐 ' + upd + '</span>'
      + '</div>'
      + '<div class="hello">' + greet + ' · ' + dateStr + '</div>'
      + '<div class="hero">'
        + '<div class="temp">' + r(c.temperature_2m) + '<sup>°C</sup></div>'
        + '<div class="bigicon">' + emoji(c.weather_code, isNight) + '</div>'
      + '</div>'
      + '<div class="cond">' + (WMO[c.weather_code] || "—") + '</div>'
      + '<div class="row pills">'
        + '<span class="pill">🥶 Sensación ' + r(c.apparent_temperature) + '°</span>'
        + '<span class="pill">💨 ' + r(c.wind_speed_10m) + ' km/h</span>'
        + '<span class="pill">💧 ' + r(c.relative_humidity_2m) + ' %</span>'
      + '</div>'
      + '<div class="range">'
        + '<div class="range-top"><span><small>MÍN</small>' + r(tmin) + '°</span><span><small>MÁX</small>' + r(tmax) + '°</span></div>'
        + '<div class="track"><div class="fill"></div><div class="mark" style="left:' + pos + '%"></div></div>'
      + '</div>'
    + '</section>'

    // --- Verdict pluie
    + '<section class="glass verdict ' + (v.rain ? "rain" : "dry") + '">'
      + '<div class="vi">' + v.icon + '</div>'
      + '<div><div class="vt">' + v.t + '</div><div class="vs">' + v.s + '</div></div>'
    + '</section>'

    // --- Détails
    + '<section class="glass">'
      + '<div class="stats">'
        + '<div class="stat"><div class="label"><span class="ic">🌧️</span>Prob. de lluvia</div>'
          + '<div class="val">' + rainMax + '<small>%</small></div>'
          + '<div class="mini"><i style="width:' + rainMax + '%;background:linear-gradient(90deg,#7fb4ff,#2f7df6)"></i></div></div>'
        + '<div class="stat"><div class="label"><span class="ic">💦</span>Acumulado</div>'
          + '<div class="val">' + fr1(day.precipitation_sum[0]) + '<small>mm</small></div>'
          + '<div class="sub">en el día</div></div>'
        + '<div class="stat"><div class="label"><span class="ic">🕶️</span>UV máx.</div>'
          + '<div class="val">' + r(uv) + '<small>' + uvLabel(uv) + '</small></div>'
          + '<div class="mini"><i style="width:' + Math.min(100, uv / 11 * 100) + '%;background:' + uvColor(uv) + '"></i></div></div>'
        + '<div class="stat"><div class="label"><span class="ic">🌅</span>Sol</div>'
          + '<div class="val" style="font-size:22px;margin-top:10px">' + hhmm(day.sunrise[0]) + '<small> → </small>' + hhmm(day.sunset[0]) + '</div>'
          + '<div class="sub">amanecer · atardecer</div></div>'
      + '</div>'
    + '</section>'

    // --- Heure par heure
    + '<section class="glass">'
      + '<div class="label"><span class="ic">⏱️</span>Próximas horas</div>'
      + '<div class="hours">' + tiles + '</div>'
    + '</section>'

    + '<footer>Datos de Open-Meteo</footer>';
}

async function go(){
  try{
    const res = await fetch(API, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const d = await res.json();
    save(d);
    render(d, Date.now());
  }catch(e){
    const s = load();
    if(s){ render(s.d, s.t); }
    else $app.innerHTML = '<section class="glass"><p class="err">No se pudo obtener el tiempo 😕 Inténtalo de nuevo en un momento.</p></section>';
  }
}

go();
document.addEventListener("visibilitychange", () => { if(!document.hidden) go(); });
</script>
</body>
</html>
